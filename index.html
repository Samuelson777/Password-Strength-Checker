<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Strength Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #20232a;
            color: #61dafb;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        #passwordInput {
            width: 300px;
            padding: 10px;
            font-size: 1.1rem;
            border-radius: 5px;
            border: none;
            outline: none;
        }
        #strengthMeter {
            width: 300px;
            height: 20px;
            background-color: #444;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }
        #strengthBar {
            height: 100%;
            width: 0;
            background-color: red;
            transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }
        #strengthText {
            margin-top: 10px;
            font-weight: bold;
        }
        ul {
            max-width: 300px;
            margin-top: 20px;
            list-style: none;
            padding: 0;
            color:#ccc;
        }
        ul li {
            margin-bottom: 5px;
        }
        ul li.valid {
            color: #4CAF50;
        }
        ul li.invalid {
            color: #f44336;
        }
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Password Strength Checker</h1>
    <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="off" />
    <div id="strengthMeter"><div id="strengthBar"></div></div>
    <div id="strengthText"></div>
    <ul id="criteriaList">
        <li id="lengthCriteria" class="invalid">At least 8 characters</li>
        <li id="uppercaseCriteria" class="invalid">Contains uppercase letter</li>
        <li id="lowercaseCriteria" class="invalid">Contains lowercase letter</li>
        <li id="numberCriteria" class="invalid">Contains number</li>
        <li id="specialCriteria" class="invalid">Contains special character (!@#$%^&*)</li>
    </ul>
    <footer>
        <p>Example project demonstrating security awareness and password strength checking.</p>
        <p>Use this for learning purposes only.</p>
    </footer>
<script>
    const passwordInput = document.getElementById('passwordInput');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    const criteria = {
        length: document.getElementById('lengthCriteria'),
        uppercase: document.getElementById('uppercaseCriteria'),
        lowercase: document.getElementById('lowercaseCriteria'),
        number: document.getElementById('numberCriteria'),
        special: document.getElementById('specialCriteria'),
    };

    passwordInput.addEventListener('input', () => {
        const password = passwordInput.value;
        let score = 0;

        // Check length
        if (password.length >= 8) {
            criteria.length.classList.remove('invalid');
            criteria.length.classList.add('valid');
            score++;
        } else {
            criteria.length.classList.remove('valid');
            criteria.length.classList.add('invalid');
        }

        // Check uppercase letters
        if (/[A-Z]/.test(password)) {
            criteria.uppercase.classList.remove('invalid');
            criteria.uppercase.classList.add('valid');
            score++;
        } else {
            criteria.uppercase.classList.remove('valid');
            criteria.uppercase.classList.add('invalid');
        }

        // Check lowercase letters
        if (/[a-z]/.test(password)) {
            criteria.lowercase.classList.remove('invalid');
            criteria.lowercase.classList.add('valid');
            score++;
        } else {
            criteria.lowercase.classList.remove('valid');
            criteria.lowercase.classList.add('invalid');
        }

        // Check numbers
        if (/\d/.test(password)) {
            criteria.number.classList.remove('invalid');
            criteria.number.classList.add('valid');
            score++;
        } else {
            criteria.number.classList.remove('valid');
            criteria.number.classList.add('invalid');
        }

        // Check special characters
        if (/[!@#$%^&*]/.test(password)) {
            criteria.special.classList.remove('invalid');
            criteria.special.classList.add('valid');
            score++;
        } else {
            criteria.special.classList.remove('valid');
            criteria.special.classList.add('invalid');
        }

        // Update strength bar and text
        let strengthPercent = (score / 5) * 100;
        strengthBar.style.width = strengthPercent + '%';
        if (score <= 1) {
            strengthBar.style.backgroundColor = 'red';
            strengthText.textContent = 'Very Weak';
        } else if (score === 2) {
            strengthBar.style.backgroundColor = 'orange';
            strengthText.textContent = 'Weak';
        } else if (score === 3) {
            strengthBar.style.backgroundColor = 'yellow';
            strengthText.textContent = 'Moderate';
        } else if (score === 4) {
            strengthBar.style.backgroundColor = '#4CAF50';
            strengthText.textContent = 'Strong';
        } else {
            strengthBar.style.backgroundColor = '#2E7D32';
            strengthText.textContent = 'Very Strong';
        }
    });
</script>
</body>
</html>
